# tmux config for codex-cli pod.
# Goal: a session survives if you close the browser tab mid-codex-run.
# Reconnect by reopening the tab and running `tmux attach`.

set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10

# Prefix Ctrl-a (more ergonomic than Ctrl-b in a browser terminal).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config.
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Sensible split bindings.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Status bar — show host and time.
set -g status-bg colour234
set -g status-fg colour137
set -g status-left '#[fg=colour154]codex-cli #[fg=colour244]| '
set -g status-right '#[fg=colour244]%Y-%m-%d %H:%M'
set -g status-interval 30
